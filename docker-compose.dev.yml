services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - kanada-auth-dev-pgdata:/var/lib/postgresql/data

volumes:
  kanada-auth-dev-pgdata:
